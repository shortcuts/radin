[package]
name = "radin"
version = "3.1.0"
edition = "2021"
description = "Cost-optimized agent harness: a repo-local backlog worked by cheap sub-agents."
license = "MIT"
repository = "https://github.com/shortcuts/radin"
homepage = "https://github.com/shortcuts/radin"
readme = "README.md"
keywords = ["agents", "backlog", "claude", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.88"

[lib]
name = "radin"
path = "src/lib.rs"

[[bin]]
name = "radin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"
